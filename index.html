<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>계산기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="title">계산기</h1>
      </header>
      <main class="calculator" aria-label="계산기">
        <div class="display" role="status" aria-live="polite" aria-atomic="true">
          <div class="display__expression" id="expression" aria-hidden="true"></div>
          <div class="display__main" id="display">0</div>
        </div>
        <div class="keys" id="keys">
          <button type="button" class="key key--fn" data-action="clear">AC</button>
          <button type="button" class="key key--fn" data-action="sign">±</button>
          <button type="button" class="key key--fn" data-action="percent">%</button>
          <button type="button" class="key key--op" data-action="operator" data-op="÷">÷</button>

          <button type="button" class="key key--num" data-action="digit" data-digit="7">7</button>
          <button type="button" class="key key--num" data-action="digit" data-digit="8">8</button>
          <button type="button" class="key key--num" data-action="digit" data-digit="9">9</button>
          <button type="button" class="key key--op" data-action="operator" data-op="×">×</button>

          <button type="button" class="key key--num" data-action="digit" data-digit="4">4</button>
          <button type="button" class="key key--num" data-action="digit" data-digit="5">5</button>
          <button type="button" class="key key--num" data-action="digit" data-digit="6">6</button>
          <button type="button" class="key key--op" data-action="operator" data-op="−">−</button>

          <button type="button" class="key key--num" data-action="digit" data-digit="1">1</button>
          <button type="button" class="key key--num" data-action="digit" data-digit="2">2</button>
          <button type="button" class="key key--num" data-action="digit" data-digit="3">3</button>
          <button type="button" class="key key--op" data-action="operator" data-op="+">+</button>

          <button type="button" class="key key--num key--wide" data-action="digit" data-digit="0">
            0
          </button>
          <button type="button" class="key key--num" data-action="decimal">.</button>
          <button type="button" class="key key--eq" data-action="equals">=</button>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
